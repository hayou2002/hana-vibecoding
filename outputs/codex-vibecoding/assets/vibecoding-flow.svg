<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980" role="img" aria-labelledby="title desc">
  <title id="title">Codex Vibecoding 全栈工作流</title>
  <desc id="desc">从阅读项目现场和需求澄清开始，按风险分档；小任务走轻闭环，复杂任务逐层经过设计、前端、API、数据、测试、审查，再用证据完成交付。外部部署需明确授权。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F5EEDC"/><stop offset="1" stop-color="#E5EFE8"/></linearGradient>
    <linearGradient id="hero" x2="1"><stop stop-color="#173333"/><stop offset="1" stop-color="#24524B"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173333" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#C66B45"/></marker>
    <style>
      text{font-family:'Segoe UI',sans-serif;fill:#173333}.small{font-size:18px}.label{font-size:16px;font-weight:700;letter-spacing:1.7px}.head{font-size:26px;font-weight:700}.copy{font-size:17px;fill:#44615a}.cream{fill:#F5EEDC}.orange{fill:#E27A50}.accent{fill:#C66B45}.gold{fill:#E7C06A}
    </style>
  </defs>
  <rect width="1440" height="980" fill="url(#bg)"/>
  <circle cx="1328" cy="111" r="86" fill="#E2C46A" opacity=".28"/>
  <circle cx="90" cy="873" r="118" fill="#D37652" opacity=".10"/>
  <text x="76" y="64" class="label accent">A FIELD GUIDE FOR BUILDING SOFTWARE WITH CODEX</text>
  <text x="76" y="122" font-size="48" font-weight="750">从一句想法，到一份可验证的交付</text>
  <text x="78" y="158" class="small" fill="#44615a">小步快验 · 纵向切片 · 真实证据 · 部署另行授权</text>

  <g filter="url(#shadow)">
    <rect x="76" y="194" width="1288" height="126" rx="26" fill="url(#hero)"/>
    <text x="108" y="232" class="label gold">START HERE</text>
    <text x="108" y="273" class="head cream">读项目现场 + 明确完成定义</text>
    <text x="108" y="299" class="small cream" opacity=".78">AGENTS.md / 现有 diff / 技术栈 / 用户目标 / 边界 / 验收</text>
    <path d="M719 257h116" stroke="#E27A50" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="875" y="238" class="label gold">CHOOSE THE LIGHTEST PATH</text>
    <text x="875" y="280" class="head cream">T0 直改　·　T1 单点　·　T2 全流程</text>
  </g>

  <path d="M718 320v38M271 358h897" fill="none" stroke="#C66B45" stroke-width="3"/>
  <path d="M271 358v37M720 358v37M1168 358v37" fill="none" stroke="#C66B45" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="76" y="405" width="391" height="124" rx="22" fill="#FFFDF7"/>
    <rect x="76" y="405" width="11" height="124" rx="5" fill="#78A38C"/>
    <text x="105" y="444" class="label" fill="#39806B">T0 · 清晰的小改</text>
    <text x="105" y="480" class="head">定位 → 修改 → 验证</text>
    <text x="105" y="509" class="small" fill="#44615a">零计划文档；不省必要检查</text>
    <rect x="524" y="405" width="391" height="124" rx="22" fill="#FFFDF7"/>
    <rect x="524" y="405" width="11" height="124" rx="5" fill="#D9AA45"/>
    <text x="553" y="444" class="label" fill="#A67617">T1 · 单一垂直切片</text>
    <text x="553" y="480" class="head">验收对齐 → 实现 → 回归</text>
    <text x="553" y="509" class="small" fill="#44615a">边界清楚；跨层但范围集中</text>
    <rect x="972" y="405" width="392" height="124" rx="22" fill="#FFFDF7"/>
    <rect x="972" y="405" width="11" height="124" rx="5" fill="#D26C47"/>
    <text x="1001" y="444" class="label" fill="#A04B31">T2 · 多模块 / 高风险</text>
    <text x="1001" y="480" class="head">短计划 → 分片实现</text>
    <text x="1001" y="509" class="small" fill="#44615a">新产品 · 数据迁移 · 权限</text>
  </g>
  <path d="M1168 529v55H720v18" fill="none" stroke="#C66B45" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="76" y="606" width="1288" height="194" rx="24" fill="#FFFDF7"/>
    <text x="111" y="647" class="label accent">BUILD A THIN VERTICAL SLICE, THEN REPEAT</text>
    <g>
      <rect x="112" y="681" width="177" height="82" rx="16" fill="#E5EFE8"/><text x="200" y="715" text-anchor="middle" class="head">UI / UX</text><text x="200" y="744" text-anchor="middle" class="small" fill="#44615a">states · a11y</text>
      <path d="M291 722h49" stroke="#C66B45" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="354" y="681" width="185" height="82" rx="16" fill="#F5E5D8"/><text x="446" y="715" text-anchor="middle" class="head">API 契约</text><text x="446" y="744" text-anchor="middle" class="small" fill="#44615a">validation · errors</text>
      <path d="M541 722h49" stroke="#C66B45" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="604" y="681" width="185" height="82" rx="16" fill="#E5EFE8"/><text x="696" y="715" text-anchor="middle" class="head">领域逻辑</text><text x="696" y="744" text-anchor="middle" class="small" fill="#44615a">rules · authz</text>
      <path d="M791 722h49" stroke="#C66B45" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="854" y="681" width="185" height="82" rx="16" fill="#F5E5D8"/><text x="946" y="715" text-anchor="middle" class="head">数据 / 集成</text><text x="946" y="744" text-anchor="middle" class="small" fill="#44615a">schema · recovery</text>
      <path d="M1041 722h49" stroke="#C66B45" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="1104" y="681" width="217" height="82" rx="16" fill="#173333"/><text x="1212" y="715" text-anchor="middle" class="head cream">测试 + 复核</text><text x="1212" y="744" text-anchor="middle" class="small cream">unit · API · browser</text>
    </g>
  </g>
  <path d="M719 800v35" stroke="#C66B45" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="220" y="847" width="1000" height="88" rx="22" fill="#173333"/>
    <text x="270" y="883" class="label gold">DONE = EVIDENCE, NOT INTENTION</text>
    <text x="270" y="915" class="head cream">目标覆盖 · 命令/浏览器实测 · diff 复核 · 限制透明</text>
    <rect x="1012" y="870" width="171" height="43" rx="12" fill="#C6533D"/>
    <text x="1097" y="898" text-anchor="middle" class="label cream">DEPLOY*</text>
  </g>
  <text x="720" y="963" text-anchor="middle" class="small" fill="#44615a">* Push、生产迁移、部署、发布、线上数据变更：明确授权后再执行，并在目标侧回读</text>
</svg>
